name: Continuous Integration

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  COVERAGE: false

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Lint
        run: pnpm lint
      - name: Test Dependency Installation
        run: pnpm install --resolution-only --no-frozen-lockfile

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: examples/basic-pnpm/pnpm-lock.yaml
      - name: Install Cypress
        uses: cypress-io/github-action@v7
        with:
          working-directory: examples/start-and-pnpm-workspaces
          runTests: false
      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          install: false
          working-directory: examples/start-and-pnpm-workspaces/packages/workspace-1
          start: pnpm start
          wait-on: "http://localhost:3000"
